<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2ff"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312e81" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="190" fill="#6658e8" opacity=".08"/>
  <circle cx="92" cy="600" r="170" fill="#6658e8" opacity=".06"/>

  <g transform="translate(62 52)">
    <circle cx="28" cy="28" r="28" fill="#6658e8"/>
    <text x="72" y="40" fill="#18181b" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">UniPlanners</text>
  </g>

  <g transform="translate(70 162)">
    <text x="0" y="0" fill="#6658e8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">PAYLAŞILAN PROGRAM</text>
    <text x="0" y="72" fill="#18181b" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Bir ders programı</text>
    <text x="0" y="137" fill="#18181b" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">seninle paylaşıldı.</text>
    <text x="0" y="191" fill="#71717a" font-family="Arial, Helvetica, sans-serif" font-size="25">Dersleri, şubeleri ve haftalık tabloyu görüntüle.</text>
  </g>

  <!-- Weekly schedule grid mockup, mirroring the app's own calendar view -->
  <g transform="translate(762 135)" filter="url(#shadow)">
    <rect width="360" height="380" rx="30" fill="#ffffff" stroke="#dedbe9" stroke-width="2"/>

    <g transform="translate(30 32)">
      <!-- Day headers -->
      <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#71717a" text-anchor="middle">
        <text x="30" y="12">Pzt</text>
        <text x="90" y="12">Sal</text>
        <text x="150" y="12">Çar</text>
        <text x="210" y="12">Per</text>
        <text x="270" y="12">Cum</text>
      </g>

      <g transform="translate(0 26)">
        <!-- Grid background lines -->
        <g stroke="#eeedf3" stroke-width="1.5">
          <line x1="0" y1="0" x2="300" y2="0"/>
          <line x1="0" y1="45" x2="300" y2="45"/>
          <line x1="0" y1="90" x2="300" y2="90"/>
          <line x1="0" y1="135" x2="300" y2="135"/>
          <line x1="0" y1="180" x2="300" y2="180"/>
          <line x1="0" y1="225" x2="300" y2="225"/>
          <line x1="0" y1="270" x2="300" y2="270"/>
          <line x1="60" y1="0" x2="60" y2="270"/>
          <line x1="120" y1="0" x2="120" y2="270"/>
          <line x1="180" y1="0" x2="180" y2="270"/>
          <line x1="240" y1="0" x2="240" y2="270"/>
        </g>

        <!-- Course blocks, colored like the real schedule grid -->
        <rect x="4" y="4" width="52" height="82" rx="9" fill="#2563eb"/>
        <rect x="64" y="49" width="52" height="37" rx="9" fill="#16a34a"/>
        <rect x="124" y="4" width="52" height="82" rx="9" fill="#7c3aed"/>
        <rect x="184" y="94" width="52" height="37" rx="9" fill="#db2777"/>
        <rect x="244" y="49" width="52" height="82" rx="9" fill="#d97706"/>
        <rect x="4" y="139" width="52" height="82" rx="9" fill="#0891b2"/>
        <rect x="124" y="139" width="52" height="37" rx="9" fill="#dc2626"/>
        <rect x="244" y="184" width="52" height="41" rx="9" fill="#4f46e5"/>
      </g>
    </g>
  </g>

  <g transform="translate(671 440)">
    <circle cx="34" cy="34" r="34" fill="#6658e8"/>
    <path d="M24 33.5a10 10 0 0 1 10-10h12a10 10 0 0 1 0 20h-7M44 34.5a10 10 0 0 1-10 10H22a10 10 0 0 1 0-20h7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="70" y="574" fill="#6658e8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">uniplanners.org</text>
</svg>
